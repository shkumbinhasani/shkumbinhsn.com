<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#4aa3ff"/>
			<stop offset="0.12" stop-color="#0a5cf0"/>
			<stop offset="0.6" stop-color="#0050ee"/>
			<stop offset="1" stop-color="#0038c8"/>
		</linearGradient>
		<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
			<stop offset="1" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
			<stop offset="0" stop-color="#fff7b0"/>
			<stop offset="0.35" stop-color="#ffd21f"/>
			<stop offset="0.7" stop-color="#ffa000"/>
			<stop offset="1" stop-color="#f06a00"/>
		</linearGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="9"/>
		</filter>
	</defs>

	<!-- Luna tile -->
	<rect x="12" y="12" width="476" height="476" rx="96" fill="#0a2a8c"/>
	<rect x="20" y="20" width="460" height="460" rx="90" fill="url(#tile)"/>
	<path d="M110 20h280a90 90 0 0 1 90 90v70Q250 260 20 180v-70a90 90 0 0 1 90-90z" fill="url(#gloss)"/>

	<!-- bolt shadow -->
	<path d="M300 58 140 290h100l-45 190 170-250h-98z" fill="#001a6e" opacity="0.6" filter="url(#shadow)" transform="translate(10 14)"/>

	<!-- bolt -->
	<path d="M290 40 130 275h100l-45 190 180-250h-98z" fill="url(#bolt)" stroke="#7a3800" stroke-width="16" stroke-linejoin="round"/>
	<!-- glint -->
	<path d="M282 68 156 258" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round"/>
</svg>
